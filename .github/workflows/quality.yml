name: Baseline quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/validate_baseline.py
      - run: pytest

  forge-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/forge
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Check Forge API crate
        run: cargo check -p api --locked
      - name: Test historical domain event API
        run: cargo test -p api --test domain_events --locked
