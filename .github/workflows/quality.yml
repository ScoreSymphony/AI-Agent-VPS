name: Platform quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - run: python -m pip install -r requirements-dev.lock

      - name: Install project build tooling
        run: python -m pip install "setuptools>=68" wheel

      - run: python -m pip check

      - run: python -m compileall -q src scripts tests

      - run: python scripts/validate_baseline.py

      - run: python scripts/validate_deployment.py

      - run: pytest -q

  forge-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: core/forge

    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Check Forge API crate
        run: cargo check -p api

      - name: Test historical domain event API
        run: cargo test -p api --test domain_events

      - name: Report Cargo.lock drift
        if: always()
        run: git diff -- Cargo.lock

  compose-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - run: python -m pip install -r requirements-dev.lock

      - name: Validate Compose syntax
        run: docker compose --profile upstream-smoke config --quiet

      - name: Validate deployment invariants
        run: python scripts/validate_deployment.py

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    needs:
      - python-quality
      - forge-rust
      - compose-contract

    steps:
      - run: echo "Platform quality gates passed"