name: scoresymphony-agent-platform

x-platform-logging: &platform-logging
  driver: json-file
  options:
    max-size: "${SCORESYMPHONY_LOG_MAX_SIZE:-10m}"
    max-file: "${SCORESYMPHONY_LOG_MAX_FILES:-3}"

services:
  forge-upstream:
    profiles: ["upstream-smoke", "reference"]
    build:
      context: ./core/forge
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${SCORESYMPHONY_BIND_HOST:-127.0.0.1}:${SCORESYMPHONY_FORGE_PORT:-8080}:8080"
    volumes:
      - forge-data:/data
    environment:
      FORGE_SERVER_BIND: "0.0.0.0:8080"
      RUST_LOG: "${SCORESYMPHONY_FORGE_LOG_LEVEL:-info}"
    labels:
      io.scoresymphony.component: forge
      io.scoresymphony.role: execution-authority
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    cpus: "${SCORESYMPHONY_FORGE_CPUS:-2.0}"
    mem_limit: "${SCORESYMPHONY_FORGE_MEMORY:-2g}"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging: *platform-logging

  gateway:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: Dockerfile.gateway
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      forge-upstream:
        condition: service_healthy
    ports:
      - "${SCORESYMPHONY_BIND_HOST:-127.0.0.1}:${SCORESYMPHONY_GATEWAY_PORT:-8090}:8090"
    environment:
      FORGE_BASE_URL: "http://forge-upstream:8080"
      FORGE_BEARER_TOKEN: "${FORGE_BEARER_TOKEN:-}"
      SCORESYMPHONY_GATEWAY_BEARER_TOKEN: "${SCORESYMPHONY_GATEWAY_BEARER_TOKEN:-}"
      SCORESYMPHONY_GATEWAY_HOST: "0.0.0.0"
      SCORESYMPHONY_GATEWAY_PORT: "8090"
      SCORESYMPHONY_FORGE_TIMEOUT_SECONDS: "${SCORESYMPHONY_FORGE_TIMEOUT_SECONDS:-10}"
      SCORESYMPHONY_EVENT_PAGE_LIMIT: "${SCORESYMPHONY_EVENT_PAGE_LIMIT:-100}"
    labels:
      io.scoresymphony.component: gateway
      io.scoresymphony.role: integration-boundary
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    cpus: "${SCORESYMPHONY_GATEWAY_CPUS:-1.0}"
    mem_limit: "${SCORESYMPHONY_GATEWAY_MEMORY:-512m}"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *platform-logging

  hermes-upstream:
    profiles: ["upstream-smoke"]
    build:
      context: ./core/hermes
      args:
        HERMES_GIT_SHA: b81383ec215400cbbc7d9768cf4ce45a19f9092a
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    network_mode: host
    command: ["gateway", "run"]
    labels:
      io.scoresymphony.component: hermes
      io.scoresymphony.role: orchestrator
    cpus: "${SCORESYMPHONY_HERMES_CPUS:-2.0}"
    mem_limit: "${SCORESYMPHONY_HERMES_MEMORY:-2g}"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging: *platform-logging

volumes:
  forge-data:
  hermes-data:
